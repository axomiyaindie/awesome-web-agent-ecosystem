name: Suggest a resource
description: Suggest an MCP server, browser agent, skill, integration, or web tool.
title: "[Resource]: "
labels:
  - resource-suggestion
body:
  - type: input
    id: resource_name
    attributes:
      label: Resource name
      placeholder: Project or tool name
    validations:
      required: true

  - type: input
    id: resource_url
    attributes:
      label: Official URL
      placeholder: https://
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Suggested category
      options:
        - MCP Servers
        - Browser Agents
        - Browser Automation
        - Agent Skills
        - Web Documentation
        - Design and Figma Integrations
        - Frontend Development Workflows
        - Testing and Quality
        - Web Research and Extraction
        - Browser DevTools
        - Web Deployment and Hosting
        - Protocols and Standards
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What does it do?
      description: Provide a concise, factual description.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Documentation and maintenance
      description: Share official documentation, compatibility, or maintenance information.
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I checked that this resource is not already listed.
          required: true
        - label: This resource is relevant to AI agents working with the web.
          required: true
        - label: I have provided an official project or documentation link.
          required: true
